<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>英語れんしゅう帳 〜中2 単語・文法・熟語〜</title>
<style>
:root{
  --bg:#fff8f3; --card:#ffffff; --ink:#4a3b3b; --sub:#8a7676;
  --east:#5b8def; --east-l:#e6eeff; --west:#ef7b5b; --west-l:#ffece6;
  --ok:#3fae7a; --ok-l:#e3f6ec; --ng:#e0566b; --ng-l:#fde8ec;
  --line:#f0e2da; --star:#f5b301;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic","Meiryo","Noto Sans JP",sans-serif;}
body{min-height:100vh}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 48px}
header.top{display:flex;align-items:center;gap:8px;margin-bottom:12px}
header.top h1{font-size:19px;margin:0;flex:1;line-height:1.3}
.back{border:none;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:8px 12px;font-size:14px;color:var(--ink)}
.hero{text-align:center;padding:18px 8px 8px}
.hero .ttl{font-size:24px;font-weight:800;letter-spacing:.02em}
.hero .sub{color:var(--sub);font-size:14px;margin-top:6px}
.ed-btn{display:block;width:100%;text-align:left;border:none;border-radius:20px;padding:18px;margin:14px 0;color:#fff;font-size:15px;box-shadow:0 4px 12px rgba(0,0,0,.08)}
.ed-btn b{display:block;font-size:22px;margin-bottom:4px}
.ed-btn .bar{height:8px;background:rgba(255,255,255,.35);border-radius:8px;margin-top:10px;overflow:hidden}
.ed-btn .bar i{display:block;height:100%;background:#fff;border-radius:8px}
.ed-btn small{opacity:.95}
.panel{background:var(--card);border-radius:18px;padding:16px;margin:12px 0;border:1.5px solid var(--line)}
.panel h3{margin:0 0 10px;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-size:14px;color:var(--ink)}
.chip.on{color:#fff;border-color:transparent}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{border:none;border-radius:16px;padding:16px 10px;font-size:15px;font-weight:700;background:#fff;border:1.5px solid var(--line);color:var(--ink)}
.mode span{display:block;font-size:26px;margin-bottom:4px}
.mode.wide{grid-column:1/3}
.mode.weak{background:#fff5d9;border-color:#f3dc9a}
.note{font-size:13px;color:var(--sub);line-height:1.6}
/* flash card */
.fc-meta{display:flex;justify-content:space-between;font-size:13px;color:var(--sub);margin:4px 2px 8px}
.flip{perspective:1200px;height:300px;margin-bottom:12px}
.flip-in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.flip.on .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:22px;padding:22px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;box-shadow:0 6px 18px rgba(0,0,0,.07);background:#fff;border:2px solid var(--line);overflow:auto}
.face.back{transform:rotateY(180deg)}
.face .q{font-size:18px;line-height:1.6;font-weight:700}
.face .a{font-size:26px;font-weight:800;margin-bottom:12px}
.face .tip{font-size:14px;line-height:1.7;color:#5d4c4c;text-align:left}
.face .hint{position:absolute;bottom:10px;font-size:12px;color:var(--sub)}
.tag{display:inline-block;font-size:12px;padding:3px 10px;border-radius:999px;background:#f6ece6;color:#7a6262;margin-bottom:10px}
.row{display:flex;gap:10px}
.btn{flex:1;border:none;border-radius:14px;padding:14px 8px;font-size:15px;font-weight:700;background:#fff;border:1.5px solid var(--line);color:var(--ink)}
.btn.pri{color:#fff;border-color:transparent}
.btn.ok{background:var(--ok);color:#fff;border-color:transparent}
.btn.later{background:#fff5d9;border-color:#f3dc9a}
.btn:disabled{opacity:.4}
/* quiz */
.qhead{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--sub);margin-bottom:8px}
.stars{color:var(--star);letter-spacing:2px;font-size:15px}
.prog{height:8px;background:#f1e5de;border-radius:8px;overflow:hidden;margin-bottom:14px}
.prog i{display:block;height:100%;transition:width .3s}
.qbox{background:#fff;border-radius:20px;border:2px solid var(--line);padding:18px;margin-bottom:12px}
.qbox .q{font-size:18px;font-weight:700;line-height:1.6}
.review-badge{display:inline-block;font-size:12px;background:#fff5d9;color:#9a7300;border-radius:999px;padding:3px 10px;margin-bottom:8px}
.choices{display:flex;flex-direction:column;gap:10px}
.choice{text-align:left;border:2px solid var(--line);background:#fff;border-radius:14px;padding:14px 14px;font-size:16px;color:var(--ink);line-height:1.5}
.choice .no{display:inline-block;width:24px;height:24px;line-height:24px;text-align:center;border-radius:50%;background:#f6ece6;font-size:13px;margin-right:8px;font-weight:700}
.choice.right{border-color:var(--ok);background:var(--ok-l)}
.choice.wrong{border-color:var(--ng);background:var(--ng-l)}
.feedback{border-radius:16px;padding:14px 16px;margin:12px 0;font-size:14px;line-height:1.7}
.feedback.ok{background:var(--ok-l);border:1.5px solid #b9e6cf}
.feedback.ng{background:var(--ng-l);border:1.5px solid #f6c3cc}
.feedback b.big{font-size:17px;display:block;margin-bottom:4px}
.lvmsg{text-align:center;font-size:13px;font-weight:700;color:#9a7300;background:#fff5d9;border-radius:12px;padding:6px;margin-bottom:10px}
.result{text-align:center;padding:10px 0}
.result .score{font-size:44px;font-weight:800}
.result .msg{font-size:15px;margin:6px 0 14px}
.misslist{text-align:left;font-size:14px;line-height:1.6}
.misslist li{margin-bottom:8px}
/* list */
.lst{list-style:none;padding:0;margin:0}
.lst li{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;font-size:14px;line-height:1.6}
.lst li .ans{font-weight:800;font-size:15px}
.lst li .t{color:#6d5a5a;font-size:13px;margin-top:4px}
.lst h4{margin:18px 0 8px;font-size:15px}
.mark{font-size:12px;margin-left:6px}
.foot{text-align:center;color:var(--sub);font-size:12px;margin-top:24px}
.reset{border:none;background:none;color:var(--sub);text-decoration:underline;font-size:12px}
.hide{display:none!important}

.ed-tango{--m:#2f9e9a;--m2:#5ec7c0;--l:#e2f5f3}
.ed-bunpo1{--m:#8a63cf;--m2:#b294ec;--l:#f0eafc}
.ed-bunpo2{--m:#4a84c8;--m2:#7fb0ea;--l:#e6effb}
.ed-jukugo{--m:#e0708a;--m2:#f5a0b4;--l:#fdeaf0}
.face .a.long{font-size:20px;line-height:1.4}
.face .q,.qbox .q,.choice,.face .a{overflow-wrap:anywhere}
.say{border:none;background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:6px 14px;font-size:14px;color:var(--ink);margin:0 0 10px}
.ed-btn{background:linear-gradient(135deg,var(--m),var(--m2))}
.chip.on{background:var(--m)}
.face.back{background:var(--l,#fff)}
.btn.pri{background:var(--m)}
.prog i{background:var(--m)}
.lst li .ans{color:var(--m)}
.sec{font-size:12px;color:var(--sub);margin:18px 2px 0}
</style>
</head>

 [2,"「なるほど・わかりました」とあいづちを打つときは？","I see.",["I look.","I watch.","See you."],"I see. ＝ なるほど。See you. は「またね」。"],
 [3,"物をわたすときの「はい、どうぞ」は？","Here you are.",["You're welcome.","Excuse me.","I'm sorry."],"Here it is. も同じように使える。お礼を言われたら You're welcome.（どういたしまして）。"],
 [3,"(　　) was your trip? — It was great!「旅行はどうだった？」","How",["What","Which","Who"],"How was 〜? ＝ 〜はどうでしたか（感想をたずねる）。"],
 [3,"「あなたに賛成です」は？","I agree with you.",["I agree to you.","I don't think so.","I disagree with you."],"agree with 人 ＝ 人に賛成する。反対なら I don't agree. / I don't think so."],
 [3,"「（私が）お手伝いしましょうか」は？","Shall I help you?",["Will you help me?","Can you help me?","Must I help you?"],"Shall I 〜? ＝ （私が）〜しましょうか。答えは Yes, please. / No, thank you."]
]};

// データ整形
const ITEMS = [];
for(const r in RAW){ if(r==='nnoun')continue; RAW[r].forEach((d,i)=>ITEMS.push({id:r+"-"+i, r, lv:d[0], q:d[1], a:d[2], w:d[3], tip:d[4], say:d[5]})); }
for(const r in RAW2){ RAW2[r].forEach((d,i)=>ITEMS.push({id:r+"-"+i, r, lv:d[0], q:d[1], a:d[2], w:d[3], tip:d[4], say:d[5]})); }
const byId = Object.fromEntries(ITEMS.map(x=>[x.id,x]));

// ===== 保存（にがて・覚えた） =====
const KEY="eigo_renshucho_v1";
let S = load();
function load(){ try{ return Object.assign({weak:{},known:{},best:{}}, JSON.parse(localStorage.getItem(KEY)||"{}")); }catch(e){ return {weak:{},known:{},best:{}}; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function addWeak(id){ S.weak[id]=Math.min((S.weak[id]||0)+2,4); delete S.known[id]; save(); }
function hitWeak(id){ if(S.weak[id]){ S.weak[id]--; if(S.weak[id]<=0) delete S.weak[id]; } S.known[id]=true; save(); }

// ===== 便利関数 =====
const $ = s=>document.querySelector(s);
const app = $("#app");
const shuffle = a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const esc = s=>String(s).replace(/[&<>\"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const stars = n=>"★".repeat(n)+"☆".repeat(3-n);
const lvName = ["","きほん","ひょうじゅん","はってん"];
// ===== 🔊 英語の読み上げ =====
const hasEn = s=>/[A-Za-z]/.test(s);
const enOnly = s=>s.replace(/「[^」]*」/g," ").replace(/（[^）]*）/g," ").replace(/[〜—]/g," ").replace(/[^\x20-\x7E]/g," ").replace(/\s+/g," ").replace(/\s+([?.!,])/g,"$1").trim();
function sayText(x){
  if(x.say!==undefined) return x.say;
  const w=x.q.match(/^([A-Za-z]+(?: \/ [A-Za-z]+)?) の/); if(w) return w[1].replace(" / ",", ")+", "+x.a;
  if(x.q.includes("(　　)")) return enOnly(x.q.replace("(　　)", x.a));
  if(hasEn(x.a)) return enOnly(x.a);
  const m=x.q.match(/「([^」]*[A-Za-z][^」]*)」/); if(m) return enOnly(m[1]);
  return enOnly(x.q);
}
function speak(t, ev){
  if(ev) ev.stopPropagation();
  if(!t || !window.speechSynthesis){ return; }
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(t); u.lang="en-US"; u.rate=0.9;
  const v=speechSynthesis.getVoices().find(v=>/^en(-|_)US/i.test(v.lang)) || speechSynthesis.getVoices().find(v=>/^en/i.test(v.lang));
  if(v) u.voice=v;
  speechSynthesis.speak(u);
}
const sayBtn = x=>{ const t=sayText(x); return (t && window.speechSynthesis)?`<button class="say" onclick="speak('${esc(t).replace(/'/g,"\\'")}',event)">🔊 発音を聞く</button>`:""; };

let cur = {ed:null, region:"all"};
function itemsOf(ed, region){
  return ITEMS.filter(x=> REGIONS[x.r].ed===ed && (region==="all"||x.r===region));
}

// ===== ホーム =====
function home(){
  cur={ed:null,region:"all"};
  const card = ed=>{
    const all=itemsOf(ed,"all"), k=all.filter(x=>S.known[x.id]).length, p=Math.round(k/all.length*100);
    const wk=all.filter(x=>S.weak[x.id]).length;
    return `<button class="ed-btn ed-${ed}" onclick="edition('${ed}')">
      <b>${EDITIONS[ed].icon} ${EDITIONS[ed].name}</b>
      <small>${EDITIONS[ed].sub}　全${all.length}問</small>
      <div class="bar"><i style="width:${p}%"></i></div>
      <small>覚えた ${k} / ${all.length}${wk?`　｜　にがて ${wk}`:""}</small>
    </button>`;
  };
  app.className="wrap";
  app.innerHTML=`
    <div class="hero"><div class="ttl">🍡 英語れんしゅう帳</div>
    <div class="sub">中2の単語・文法・熟語　覚える → クイズでたしかめよう</div></div>
    ${Object.keys(EDITIONS).map(card).join("")}
    <div class="panel"><h3>🌸 つかいかた</h3>
      <div class="note">① <b>覚えるカード</b>：タップでうらがえして答えと解説をチェック<br>
      ② <b>クイズ</b>：4択で10問。出る順はランダム、正解が続くと<b>だんだん難しく</b>なるよ<br>
      ③ まちがえた問題は<b>少しあとでもう一回</b>出るよ。<b>にがて</b>にも記録されて、次のクイズでも<b>たまに復習</b>で出てくるよ<br>
      ④ カードのうらやクイズの答えのあとで <b>🔊 発音を聞く</b> を押すと、英語を読み上げてくれるよ</div>
    </div>
    <div class="foot">記録はこの端末のブラウザに保存されます<br><button class="reset" onclick="resetAll()">記録をリセット</button></div>`;
  scrollTo(0,0);
}
function resetAll(){ if(confirm("覚えた・にがての記録をぜんぶ消してもいい？")){ S={weak:{},known:{},best:{}}; save(); home(); } }

// ===== 編のメニュー =====
function edition(ed, region){
  cur.ed=ed; if(region!==undefined) cur.region=region;
  const E=EDITIONS[ed];
  const list=itemsOf(ed,cur.region);
  const weakN=list.filter(x=>S.weak[x.id]).length;
  const knownN=list.filter(x=>S.known[x.id]).length;
  app.className="wrap ed-"+ed;
  app.innerHTML=`
    <header class="top"><button class="back" onclick="home()">← もどる</button><h1>${E.icon} ${E.name}</h1></header>
    <div class="panel"><h3>どれをやる？</h3><div class="chips">
      <button class="chip ${cur.region==="all"?"on":""}" onclick="edition('${ed}','all')">ぜんぶ</button>
      ${E.regions.map(r=>`<button class="chip ${cur.region===r?"on":""}" onclick="edition('${ed}','${r}')">${REGIONS[r].name}</button>`).join("")}
    </div>
    <div class="note" style="margin-top:10px">${list.length}問　｜　覚えた ${knownN}　｜　にがて ${weakN}</div></div>
    <div class="modes">
      <button class="mode" onclick="cards()"><span>📖</span>覚えるカード</button>
      <button class="mode" onclick="startQuiz(false)"><span>✏️</span>クイズ（10問）</button>
      <button class="mode" onclick="summary()"><span>📋</span>まとめ一覧</button>
      <button class="mode weak" onclick="startQuiz(true)" ${weakN?"":"disabled style='opacity:.45'"}><span>🔁</span>にがてだけ</button>
    </div>
    <p class="note" style="margin-top:14px">💡 さいしょは「覚えるカード」でひと通り見てから、クイズにチャレンジするのがおすすめ！</p>`;
  scrollTo(0,0);
}

// ===== 覚えるカード =====
let fc={list:[],i:0};
function cards(){
  const list=itemsOf(cur.ed,cur.region);
  // まだ覚えていないもの → 覚えたもの の順（それぞれシャッフル）
  fc.list=shuffle(list.filter(x=>!S.known[x.id])).concat(shuffle(list.filter(x=>S.known[x.id])));
  fc.i=0; drawCard();
}
function drawCard(){
  const x=fc.list[fc.i];
  if(!x){ return edition(cur.ed); }
  app.innerHTML=`
    <header class="top"><button class="back" onclick="edition('${cur.ed}')">← もどる</button><h1>📖 覚えるカード</h1></header>
    <div class="fc-meta"><span>${REGIONS[x.r].name}　${stars(x.lv)}</span><span>${fc.i+1} / ${fc.list.length}${S.known[x.id]?"　✅覚えた":""}${S.weak[x.id]?"　⚠️にがて":""}</span></div>
    <div class="flip" id="flip" onclick="this.classList.toggle('on')"><div class="flip-in">
      <div class="face front"><span class="tag">${REGIONS[x.r].name}</span><div class="q">${esc(x.q)}</div><div class="hint">タップでこたえ 👆</div></div>
      <div class="face back"><div class="a ${x.a.length>16?"long":""}">${esc(x.a)}</div>${sayBtn(x)}<div class="tip">💡 ${esc(x.tip)}</div><div class="hint">タップでもどる</div></div>
    </div></div>
    <div class="row" style="margin-bottom:10px">
      <button class="btn later" onclick="cardMark(false)">🤔 まだあやしい</button>
      <button class="btn ok" onclick="cardMark(true)">😊 覚えた！</button>
    </div>
    <div class="row">
      <button class="btn" onclick="cardMove(-1)" ${fc.i===0?"disabled":""}>◀ まえ</button>
      <button class="btn" onclick="cardMove(1)">つぎ ▶</button>
    </div>`;
}
function cardMark(ok){
  const x=fc.list[fc.i];
  if(ok){ S.known[x.id]=true; save(); }
  else { delete S.known[x.id]; S.weak[x.id]=Math.max(S.weak[x.id]||0,1); save();
         // あやしいカードは少しあとにもう一度
         const pos=Math.min(fc.i+4, fc.list.length); fc.list.splice(pos,0,x); }
  cardMove(1);
}
function cardMove(d){
  fc.i+=d;
  if(fc.i>=fc.list.length){
    app.innerHTML=`<header class="top"><button class="back" onclick="edition('${cur.ed}')">← もどる</button><h1>📖 覚えるカード</h1></header>
      <div class="panel result"><div class="score">🎉</div><div class="msg">ひと通り見おわったよ！<br>つぎはクイズでたしかめてみよう</div>
      <div class="row"><button class="btn" onclick="cards()">もう一回</button><button class="btn pri" onclick="startQuiz(false)">クイズへ ✏️</button></div></div>`;
    return;
  }
  if(fc.i<0) fc.i=0;
  drawCard();
}

// ===== クイズ（ランダム・だんだん難しく・たまに復習） =====
const ROUND=10;
let Q=null;
function startQuiz(weakOnly){
  const pool=itemsOf(cur.ed,cur.region);
  const usable = weakOnly ? pool.filter(x=>S.weak[x.id]) : pool;
  if(!usable.length){ alert("にがての問題はないよ！すごい🎉"); return; }
  Q={weakOnly, pool:usable, asked:new Set(), queue:[], n:0, total:Math.min(ROUND, usable.length),
     lv: weakOnly?2:1, streak:0, miss:0, right:0, missed:[], lvmsg:"", current:null, answered:false};
  nextQ();
}
function pickNext(){
  // ① 同じクイズ内でまちがえた問題（3問後に再出題）
  const due=Q.queue.findIndex(e=>e.at<=Q.n);
  if(due>=0){ const e=Q.queue.splice(due,1)[0]; return {item:e.item, review:"さっきまちがえた問題だよ"}; }
  // ② たまに「にがて」から復習（約25%）
  if(!Q.weakOnly && Math.random()<0.25){
    const w=shuffle(Q.pool.filter(x=>S.weak[x.id] && !Q.asked.has(x.id)));
    if(w.length) return {item:w[0], review:"にがて復習"};
  }
  // ③ いまのレベルに近い問題をランダムに
  const rest=Q.pool.filter(x=>!Q.asked.has(x.id));
  const src = rest.length?rest:Q.pool;
  for(const d of [0,-1,1,-2,2]){
    const c=src.filter(x=>x.lv===Q.lv+d);
    if(c.length) return {item:shuffle(c)[0], review:""};
  }
  return {item:shuffle(src)[0], review:""};
}
function nextQ(){
  if(Q.n>=Q.total) return quizEnd();
  const p=pickNext();
  Q.current=p; Q.asked.add(p.item.id); Q.answered=false;
  Q.choices=shuffle([p.item.a, ...p.item.w]);
  drawQ();
}
function drawQ(){
  const x=Q.current.item;
  app.innerHTML=`
    <header class="top"><button class="back" onclick="if(confirm('クイズをやめる？'))edition('${cur.ed}')">← やめる</button><h1>✏️ クイズ${Q.weakOnly?"（にがて）":""}</h1></header>
    <div class="qhead"><span>${Q.n+1} / ${Q.total}問　｜　正解 ${Q.right}</span><span>レベル <span class="stars">${stars(Q.lv)}</span></span></div>
    <div class="prog"><i style="width:${Q.n/Q.total*100}%"></i></div>
    ${Q.lvmsg?`<div class="lvmsg">${Q.lvmsg}</div>`:""}
    <div class="qbox">
      ${Q.current.review?`<span class="review-badge">🔁 ${Q.current.review}</span><br>`:""}
      <span class="tag">${REGIONS[x.r].name}・${lvName[x.lv]}</span>
      <div class="q">${esc(x.q)}</div>
    </div>
    <div class="choices">${Q.choices.map((c,i)=>`<button class="choice" data-c="${esc(c)}" onclick="answer(${i})"><span class="no">${i+1}</span>${esc(c)}</button>`).join("")}</div>
    <div id="fb"></div>`;
  Q.lvmsg="";
  scrollTo(0,0);
}
function answer(i){
  if(Q.answered) return; Q.answered=true;
  const x=Q.current.item, pick=Q.choices[i], ok=pick===x.a;
  document.querySelectorAll(".choice").forEach((b,j)=>{
    if(Q.choices[j]===x.a) b.classList.add("right");
    else if(j===i) b.classList.add("wrong");
  });
  if(ok){
    Q.right++; Q.streak = Q.streak>0?Q.streak+1:1; hitWeak(x.id);
    if(Q.streak>=2 && Q.lv<3){ Q.lv++; Q.streak=0; Q.lvmsg="⬆️ レベルアップ！ちょっと難しくなるよ"; }
  }else{
    Q.miss++; Q.streak = Q.streak<0?Q.streak-1:-1; addWeak(x.id);
    if(!Q.missed.includes(x)) Q.missed.push(x);
    // 同じクイズの中で、3問あとにもう一回（1回まで）
    if(!Q.current.review.startsWith("さっき")) { Q.queue.push({item:x, at:Q.n+3}); if(Q.total<ROUND+3) Q.total++; }
    if(Q.streak<=-1 && Q.lv>1){ Q.lv--; Q.streak=0; Q.lvmsg="⬇️ 少しやさしい問題で、もう一回かためよう"; }
  }
  const praise=["せいかい！🎉","すごい！🌟","ばっちり！🍡","さすが！✨"];
  $("#fb").innerHTML=`
    <div class="feedback ${ok?"ok":"ng"}">
      <b class="big">${ok?praise[Math.floor(Math.random()*praise.length)]:"おしい！こたえは「"+esc(x.a)+"」"}</b>
      ${sayBtn(x)}<br>💡 ${esc(x.tip)}
      ${ok?"":`<div style="margin-top:6px;font-size:13px">→ 少しあとで、もう一回出すね</div>`}
    </div>
    <button class="btn pri" style="width:100%" onclick="Q.n++;nextQ()">${Q.n+1>=Q.total?"けっかをみる 🏁":"つぎの問題 ▶"}</button>`;
  $("#fb").scrollIntoView({behavior:"smooth",block:"nearest"});
}
function quizEnd(){
  const asked=Q.right+Q.miss, rate=asked?Math.round(Q.right/asked*100):0;
  const msg = rate>=90?"すばらしい！ほぼかんぺき🌟":rate>=70?"よくできたね！あと少し🍡":rate>=50?"いい調子！にがてを復習しよう🌙":"だいじょうぶ、カードでもう一回見てみよう🍙";
  const key=cur.ed+"-"+cur.region; if(!S.best[key]||rate>S.best[key]){ S.best[key]=rate; save(); }
  app.innerHTML=`
    <header class="top"><button class="back" onclick="edition('${cur.ed}')">← もどる</button><h1>🏁 けっか</h1></header>
    <div class="panel result">
      <div class="score">${Q.right} / ${asked}</div>
      <div class="msg">正解率 ${rate}%　さいごのレベル ${stars(Q.lv)}<br>${msg}</div>
      ${Q.missed.length?`<div class="misslist"><b>🔁 まちがえた問題（にがてに記録したよ）</b><ul>${Q.missed.map(x=>`<li>${esc(x.q)}<br>→ <b>${esc(x.a)}</b></li>`).join("")}</ul></div>`:"<div class='msg'>まちがいゼロ！🎉</div>"}
      <div class="row" style="margin-top:10px">
        <button class="btn" onclick="startQuiz(false)">もう一回</button>
        ${Q.missed.length?`<button class="btn later" onclick="startQuiz(true)">にがてだけ 🔁</button>`:""}
      </div>
      <div class="row" style="margin-top:10px"><button class="btn pri" onclick="edition('${cur.ed}')">メニューへ</button></div>
    </div>`;
  scrollTo(0,0);
}

// ===== まとめ一覧 =====
function summary(){
  const E=EDITIONS[cur.ed];
  const regs = cur.region==="all"?E.regions:[cur.region];
  app.innerHTML=`
    <header class="top"><button class="back" onclick="edition('${cur.ed}')">← もどる</button><h1>📋 まとめ一覧</h1></header>
    <p class="note">テスト前の見直し用。✅覚えた　⚠️にがて</p>
    ${regs.map(r=>`<h4 style="margin:18px 0 8px">📝 ${REGIONS[r].name}</h4><ul class="lst">${
      ITEMS.filter(x=>x.r===r).sort((a,b)=>a.lv-b.lv).map(x=>`<li>${esc(x.q)}<span class="mark">${S.known[x.id]?"✅":""}${S.weak[x.id]?"⚠️":""}</span>
        <div class="ans">→ ${esc(x.a)}</div><div class="t">${esc(x.tip)}</div></li>`).join("")}</ul>`).join("")}`;
  scrollTo(0,0);
}

home();
</script>
